<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Musette IA · Cercle IA EdG-T</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* =========================================================
   Musette IA — Cercle IA EdG-T
   Charte : kit graphique Cercle IA EdG-T v1.2 (celui de la Veille IA)
   Structure : application Garigliano (mobile d'abord, une colonne,
   page de garde, menu à tuiles, barre de rubriques en bas)
   ========================================================= */
:root{
  --fond:#f3f5f8;--surface:#ffffff;--encre:#14213a;--attenue:#5a6680;--trait:#d5dbe6;
  --bleu:#1d3f8f;--rouge:#c1272d;--bande:#e9eef7;--vert:#0f7b6c;--ambre:#b26a00;
  --t-skill:#1d5fbf;--t-webapp:#0f7b6c;--t-artefact:#b26a00;--t-prompt:#6b4bb8;--t-projet:#4b5563;
  --tech:29,63,143;--tech-a:.07;--sur-pastille:#ffffff;
  --display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --fond:#0f1522;--surface:#161e2e;--encre:#e6ebf4;--attenue:#9aa6bd;--trait:#2a3550;
  --bleu:#9db8ec;--rouge:#ff6b5e;--bande:#18223a;--vert:#3cc2ad;--ambre:#f0a838;
  --t-skill:#5b9bff;--t-webapp:#3cc2ad;--t-artefact:#f0a838;--t-prompt:#a98cf0;--t-projet:#a3acba;
  --tech:157,184,236;--tech-a:.06;--sur-pastille:#0f1522;color-scheme:dark}}
:root[data-theme="dark"]{
  --fond:#0f1522;--surface:#161e2e;--encre:#e6ebf4;--attenue:#9aa6bd;--trait:#2a3550;
  --bleu:#9db8ec;--rouge:#ff6b5e;--bande:#18223a;--vert:#3cc2ad;--ambre:#f0a838;
  --t-skill:#5b9bff;--t-webapp:#3cc2ad;--t-artefact:#f0a838;--t-prompt:#a98cf0;--t-projet:#a3acba;
  --tech:157,184,236;--tech-a:.06;--sur-pastille:#0f1522;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--fond)}
body{color:var(--encre);font-family:var(--display);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
img{display:block;max-width:100%}
a{color:var(--bleu)}
p{margin:0}

/* fond techno, faible saturation : halos et points en marge, jamais sous le texte */
#techno{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
   radial-gradient(700px 500px at 100% 0%,rgba(var(--tech),calc(var(--tech-a)*1.4)),transparent 70%),
   radial-gradient(600px 500px at 0% 100%,rgba(var(--tech),calc(var(--tech-a)*1.1)),transparent 70%)}
#techno::after{content:"";position:absolute;inset:0;
  background:radial-gradient(rgba(var(--tech),calc(var(--tech-a)*2)) 1.2px,transparent 1.4px) 0 0/28px 28px;
  -webkit-mask-image:linear-gradient(90deg,#000 0,transparent 40px,transparent calc(100% - 40px),#000 100%);
          mask-image:linear-gradient(90deg,#000 0,transparent 40px,transparent calc(100% - 40px),#000 100%)}
@media (min-width:860px){
  #techno::after{-webkit-mask-image:linear-gradient(90deg,#000 0,transparent calc(50% - 400px),transparent calc(50% + 400px),#000 100%);
                         mask-image:linear-gradient(90deg,#000 0,transparent calc(50% - 400px),transparent calc(50% + 400px),#000 100%)}}

.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:0 16px 120px}
.tricolore{display:block;width:80px;height:5px;background:linear-gradient(90deg,#1d3f8f 0 33.3%,#fff 33.3% 66.6%,#c1272d 66.6%);border-bottom:1px solid var(--trait)}
.mention{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--attenue);text-align:center;padding-top:10px}

/* ---------- page de garde (reprise Garigliano) ---------- */
[hidden]{display:none!important}
#cover{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;background:#0f1522;color:#e6ebf4;overflow:hidden}
#cover::before{content:"";position:absolute;inset:0;
  background:
   radial-gradient(900px 600px at 90% 5%,rgba(157,184,236,.16),transparent 70%),
   radial-gradient(rgba(157,184,236,.16) 1.3px,transparent 1.5px) 0 0/30px 30px}
#cover .circ{position:absolute;right:-40px;top:12%;width:min(620px,95vw);color:rgba(157,184,236,.28)}
.cv-body{position:relative;z-index:1;width:100%;max-width:760px;margin:0 auto;padding:28px 22px calc(34px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.cv-ins{width:84px;background:#fff;border-radius:16px;padding:8px}
.cv-org{font-family:var(--mono);font-size:13px;letter-spacing:.16em;color:#9aa6bd}
.cv-title{font-weight:700;font-size:clamp(52px,14vw,124px);line-height:.92;margin:0;letter-spacing:-.01em}
.cv-title span{display:block;color:#9db8ec}
#cover .tricolore{width:110px;height:7px;border-bottom:0}
.cv-sub{font-size:clamp(18px,4.6vw,24px);color:#c9d2e3;max-width:32ch}
.cv-go{appearance:none;align-self:flex-start;margin-top:8px;background:#e6ebf4;color:#0f1522;border:0;border-radius:999px;font-weight:700;font-size:20px;padding:12px 30px;cursor:pointer}
.cv-go:focus-visible,.cv-alt:focus-visible{outline:3px solid #9db8ec;outline-offset:3px}
.cv-choix{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;max-width:520px}
.cv-choix button{margin:0;align-self:stretch;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border-radius:16px;padding:14px 18px}
.cv-choix small{font-weight:500;font-size:14px;opacity:.75}
.cv-alt{appearance:none;background:transparent;color:#e6ebf4;border:2px solid #9db8ec;border-radius:16px;font-weight:700;font-size:20px;cursor:pointer}
@media (max-width:420px){.cv-choix{grid-template-columns:1fr}}
#cover.out{animation:cvout .5s ease forwards}
@keyframes cvout{to{opacity:0;visibility:hidden}}

/* ---------- bandeau de marque (reprise Veille IA) ---------- */
header.brand{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;margin-top:10px;padding:10px 14px;border-radius:16px;
  background:color-mix(in srgb,var(--surface) 86%,transparent);border:1px solid var(--trait);
  box-shadow:0 2px 12px color-mix(in srgb,var(--encre) 7%,transparent);backdrop-filter:blur(6px)}
header.brand>*{position:relative;z-index:1}
header.brand .deco{position:absolute;z-index:0;left:46%;right:110px;top:0;bottom:0;color:rgba(var(--tech),.22);pointer-events:none}
header.brand .deco svg{width:100%;height:100%}
.brand-btn{appearance:none;border:0;background:none;padding:0;cursor:pointer;display:flex;align-items:center;gap:12px;text-align:left;min-width:0}
.logo{width:56px;height:auto;background:#fff;border-radius:12px;padding:5px;flex:none;box-shadow:0 1px 4px color-mix(in srgb,var(--encre) 15%,transparent)}
.wm{display:grid;gap:2px;min-width:0}
.wm b{font-size:24px;font-weight:700;letter-spacing:.04em;line-height:1;color:var(--bleu);white-space:nowrap}
.wm b em{font-style:normal;color:var(--encre)}
.wm small{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;color:var(--attenue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wm .tricolore{width:64px;height:4px;margin-top:3px}
.hdr-r{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.proto{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;background:var(--bande);color:var(--bleu);border:1px solid color-mix(in srgb,var(--bleu) 40%,transparent);border-radius:999px;padding:3px 9px;white-space:nowrap}
.iconbtn{appearance:none;border:1.5px solid var(--trait);background:var(--surface);border-radius:999px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--attenue)}
.iconbtn svg{width:18px;height:18px}

/* ---------- composants ---------- */
h2{font-size:34px;line-height:1.08;font-weight:700;margin:0;text-wrap:balance}
h3{font-size:17px;font-weight:700;letter-spacing:.06em;color:var(--bleu);margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--attenue)}
.lead{font-size:20px;line-height:1.4}
.card{background:var(--surface);border:1px solid var(--trait);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;font-weight:600;font-size:17px;border:1.5px solid var(--attenue);background:var(--surface);color:var(--encre);border-radius:999px;padding:8px 18px;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--encre)}
.btn.primary{background:var(--bleu);border-color:var(--bleu);color:var(--sur-pastille)}
.btn.small{min-height:36px;font-size:15px;padding:5px 14px}
.btn svg{width:18px;height:18px;flex:none}
.link{appearance:none;border:0;background:none;padding:6px 0;color:var(--bleu);font-weight:600;font-size:16px;cursor:pointer;text-align:left}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--bleu);outline-offset:2px}
.topbar{justify-content:space-between}
.menu-back{appearance:none;border:1.5px solid var(--trait);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:15px;cursor:pointer;color:var(--encre)}
.help-btn{appearance:none;width:36px;height:36px;border-radius:999px;border:1.5px solid var(--bleu);background:var(--surface);color:var(--bleu);font-weight:700;font-size:18px;cursor:pointer}
.helpbox{border-left:4px solid var(--bleu);background:var(--bande);border-radius:0 12px 12px 0;padding:12px 14px;font-size:16px}
.helpbox b{color:var(--bleu)}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.04em;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.type{color:var(--sur-pastille);background:var(--tc)}
.pill.ok{background:color-mix(in srgb,var(--vert) 14%,transparent);color:var(--vert);border:1px solid color-mix(in srgb,var(--vert) 45%,transparent)}
.pill.plain{border:1px solid var(--trait);color:var(--attenue);background:var(--surface)}
.stars{color:var(--ambre);letter-spacing:1px;font-size:15px;white-space:nowrap}
.stars small{color:var(--attenue);font-family:var(--mono);font-size:12px;letter-spacing:0;margin-left:4px}
.note{font-size:15px;color:var(--attenue);font-style:italic}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--trait);vertical-align:top}
th{font-weight:600;color:var(--attenue);width:38%}
.tbl{overflow-x:auto}

/* ---------- accueil (tuiles Garigliano) ---------- */
.home-hero{text-align:center;display:grid;justify-items:center;gap:8px;padding:26px 6px 4px}
.home-hero h1{margin:0;font-size:clamp(38px,9vw,56px);line-height:1.02;font-weight:700}
.home-hero .tricolore{width:96px;height:6px}
.home-hero p{font-size:19px;color:var(--attenue);max-width:34ch}
.choix{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.choix{grid-template-columns:1fr}}
.gros{appearance:none;cursor:pointer;text-align:left;border-radius:18px;padding:20px 20px 18px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;border:2px solid var(--gc);background:color-mix(in srgb,var(--gc) 9%,var(--surface));color:var(--encre);min-height:112px}
.gros .gi{grid-row:1/3;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--gc);color:var(--sur-pastille)}
.gros .gi svg{width:28px;height:28px}
.gros b{font-size:26px;line-height:1.05}
.gros small{font-size:15.5px;color:var(--attenue);line-height:1.3}
.gros:hover{background:color-mix(in srgb,var(--gc) 16%,var(--surface))}
.home-now{appearance:none;width:100%;text-align:left;display:flex;align-items:center;gap:14px;background:var(--surface);border:1.5px solid color-mix(in srgb,var(--bleu) 45%,transparent);border-radius:14px;padding:12px 16px;cursor:pointer}
.home-now .k{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--attenue)}
.home-now b{display:block;font-size:20px;line-height:1.15}
.home-now .dot{width:10px;height:10px;border-radius:999px;background:var(--bleu);flex:none;box-shadow:0 0 0 5px color-mix(in srgb,var(--bleu) 18%,transparent)}
.home-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{appearance:none;position:relative;overflow:hidden;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--trait);border-radius:16px;padding:16px 16px 14px;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;color:var(--encre)}
.tile::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:5px;border-radius:0 5px 5px 0;background:var(--tc,var(--bleu))}
.tile .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc,var(--bleu)) 14%,transparent);color:var(--tc,var(--bleu))}
.tile .ic svg{width:22px;height:22px}
.tile b{display:block;font-size:20px;line-height:1.1}
.tile small{display:block;font-size:14.5px;color:var(--attenue);line-height:1.3;margin-top:3px}
.tile .n{position:absolute;right:14px;top:12px;font-family:var(--mono);font-size:22px;font-weight:500;color:var(--tc,var(--bleu))}
.tile:hover{border-color:var(--tc,var(--bleu))}
.tile.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px}

/* ---------- catalogue ---------- */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--attenue);border-radius:999px;padding:4px 6px 4px 16px}
.search svg{width:20px;height:20px;color:var(--attenue);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:17px;padding:8px 0}
.search:focus-within{outline:3px solid var(--bleu);outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{appearance:none;flex:0 0 auto;font-weight:600;font-size:15px;border:1.5px solid var(--trait);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip i{width:9px;height:9px;border-radius:99px;background:var(--tc,var(--attenue))}
.chip[aria-pressed="true"]{background:var(--encre);color:var(--fond);border-color:var(--encre)}
select{appearance:none;border:1.5px solid var(--trait);background:var(--surface);border-radius:999px;padding:6px 32px 6px 14px;font-weight:600;font-size:15px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--attenue) 50%),linear-gradient(135deg,var(--attenue) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.count{font-family:var(--mono);font-size:13px;color:var(--attenue)}
.tool{appearance:none;text-align:left;cursor:pointer;position:relative;background:var(--surface);border:1px solid var(--trait);border-radius:14px;padding:14px 16px 14px 22px;display:grid;gap:6px;color:var(--encre);width:100%}
.tool::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:5px;border-radius:0 5px 5px 0;background:var(--tc)}
.tool:hover{border-color:var(--tc)}
.tool .t{font-size:21px;font-weight:700;line-height:1.15}
.tool .r{font-size:16px;color:var(--attenue);line-height:1.35}
.tool .meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:2px}
.tool .fav{position:absolute;right:12px;top:12px;color:var(--ambre);font-size:18px}
.empty{text-align:center;padding:30px 16px;display:grid;gap:10px;justify-items:center}

/* ---------- fiche outil ---------- */
.f-head{display:grid;gap:10px}
.f-head .tricolore{width:72px}
.apercu{border-radius:14px;overflow:hidden;border:1px solid var(--trait);background:var(--bande);aspect-ratio:16/8;position:relative}
.apercu svg{width:100%;height:100%;display:block}
.apercu figcaption{position:absolute;left:12px;bottom:10px;font-family:var(--mono);font-size:12px;color:var(--attenue);background:color-mix(in srgb,var(--surface) 85%,transparent);border-radius:999px;padding:2px 10px}
.actions{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:560px){.actions{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:10px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start}
ol.steps li::before{content:counter(s);width:30px;height:30px;border-radius:999px;display:grid;place-items:center;background:var(--bande);color:var(--bleu);font-weight:700;border:1.5px solid color-mix(in srgb,var(--bleu) 45%,transparent)}
ul.l{margin:0;padding-left:20px;display:grid;gap:6px}
ul.l li::marker{color:var(--bleu)}
.versions{display:grid;gap:8px}
.versions div{display:grid;grid-template-columns:70px 1fr;gap:10px;font-size:16px}
.versions b{font-family:var(--mono);font-weight:500;font-size:14px;color:var(--bleu)}

/* ---------- déposer ---------- */
.circuit{display:grid;gap:0}
.circuit .st{display:grid;grid-template-columns:40px 1fr;gap:12px;position:relative;padding-bottom:16px}
.circuit .st:not(:last-child)::after{content:"";position:absolute;left:19px;top:38px;bottom:2px;width:2px;background:color-mix(in srgb,var(--bleu) 35%,transparent)}
.circuit .num{width:40px;height:40px;border-radius:999px;background:var(--bleu);color:var(--sur-pastille);display:grid;place-items:center;font-weight:700;font-size:18px}
.circuit .st:last-child .num{background:var(--vert)}
.circuit b{display:block;font-size:19px}
.circuit .qui{font-family:var(--mono);font-size:12px;color:var(--attenue)}
pre.modele{margin:0;white-space:pre-wrap;font-family:var(--mono);font-size:13.5px;line-height:1.55;background:var(--bande);border-radius:12px;padding:14px;border:1px solid var(--trait);overflow-x:auto}
.regle{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start}
.regle span{font-size:20px;line-height:1.2}
details{background:var(--surface);border:1px solid var(--trait);border-radius:14px;padding:0 16px}
details summary{cursor:pointer;list-style:none;padding:14px 0;font-weight:700;font-size:19px;display:flex;justify-content:space-between;align-items:center;gap:10px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";font-size:24px;color:var(--bleu);font-weight:500}
details[open] summary::after{content:"–"}
details>div{padding:0 0 16px;display:grid;gap:10px}

/* ---------- formulaire de dépôt ---------- */
.form{display:grid;gap:14px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}
.field{display:grid;gap:5px;min-width:0}
.field>span{font-weight:600;font-size:16px}
.field>span i{font-style:normal;color:var(--rouge)}
.field small.aide{font-size:14px;color:var(--attenue)}
.field input,.field textarea,.field select{width:100%;border:1.5px solid var(--attenue);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16.5px;line-height:1.35}
.field select{border-radius:10px;padding-right:32px;font-weight:400}
.field textarea{resize:vertical;min-height:84px}
.field input:focus,.field textarea:focus,.field select:focus{outline:3px solid var(--bleu);outline-offset:1px}
.field.bad input,.field.bad textarea,.field.bad select{border-color:var(--rouge)}
.field .msg{display:none;font-size:14px;color:var(--rouge);font-weight:600}
.field.bad .msg{display:block}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--trait);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:15px;background:var(--surface)}
.checks input{accent-color:var(--bleu);width:16px;height:16px}
.certif{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;background:var(--bande);border-radius:12px;padding:12px 14px;cursor:pointer}
.certif input{width:20px;height:20px;accent-color:var(--bleu);margin-top:2px}
.certif.bad{outline:2px solid var(--rouge)}
.compteur{font-family:var(--mono);font-size:12px;color:var(--attenue);justify-self:end}
.etape-num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:999px;background:var(--bleu);color:var(--sur-pastille);font-weight:700;font-size:15px;margin-right:8px}
.pret{border:2px solid var(--vert)}
.pj{display:grid;gap:6px;background:color-mix(in srgb,var(--ambre) 12%,var(--surface));border:1.5px solid color-mix(in srgb,var(--ambre) 50%,transparent);border-radius:12px;padding:12px 14px}
.pj b{color:var(--ambre)}
.btn.vert{background:var(--vert);border-color:var(--vert);color:var(--sur-pastille)}

/* ---------- pied & barre de rubriques ---------- */
footer.pied{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--attenue);border-top:1px solid var(--trait);padding-top:10px;margin-top:26px}
.prot{letter-spacing:.1em;border:1px solid var(--trait);border-radius:4px;padding:2px 6px}
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--trait);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
nav.tabbar .in{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;width:100%;max-width:760px}
.nb{appearance:none;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;border-radius:10px;font-size:12.5px;font-weight:600;color:var(--attenue);cursor:pointer}
.nb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nb[aria-current="page"]{color:var(--bleu);background:var(--bande)}
body.is-home nav.tabbar{display:none}
body.is-home .wrap{padding-bottom:40px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;max-width:min(92vw,520px);background:var(--encre);color:var(--fond);border-radius:12px;padding:10px 16px;font-size:15px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:no-preference){.view{animation:vin .18s ease-out}@keyframes vin{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
@media (prefers-reduced-motion:reduce){#cover.out{animation:none;display:none}}
@media (max-width:620px){header.brand .deco{display:none}}
@media (max-width:420px){.wm b{font-size:20px}.logo{width:46px}h2{font-size:30px}.proto{display:none}}
</style>
</head>

  const n=Math.round(o.note); return `<span class="stars" aria-label="Note ${String(o.note).replace(".",",")} sur 5">${"★".repeat(n)}${"☆".repeat(5-n)}<small>${String(o.note).replace(".",",")} · ${o.avis} avis</small></span>`;
}
function toolCard(o){
  const T=TYPES[o.type];
  return `<button class="tool" data-tool="${o.id}" style="--tc:${T.tc}">

}
function apercu(o){
  /* aperçu généré tant qu’aucune capture n’est fournie : une silhouette par type */
  const c=getComputedStyle(document.documentElement).getPropertyValue("--t-"+o.type).trim()||"#1d3f8f";
  const shapes={
    skill:`<g fill="${c}"><rect x="40" y="50" width="200" height="16" rx="8" opacity=".9"/><rect x="40" y="80" width="300" height="10" rx="5" opacity=".35"/><rect x="40" y="100" width="260" height="10" rx="5" opacity=".35"/><rect x="40" y="130" width="140" height="44" rx="10" opacity=".18"/><rect x="196" y="130" width="140" height="44" rx="10" opacity=".18"/><rect x="352" y="130" width="140" height="44" rx="10" opacity=".18"/></g>`,
    webapp:`<g><rect x="40" y="30" width="520" height="150" rx="12" fill="none" stroke="${c}" stroke-width="2" opacity=".6"/><rect x="40" y="30" width="520" height="24" rx="12" fill="${c}" opacity=".2"/><rect x="60" y="72" width="150" height="90" rx="8" fill="${c}" opacity=".18"/><rect x="226" y="72" width="314" height="16" rx="8" fill="${c}" opacity=".5"/><rect x="226" y="100" width="260" height="10" rx="5" fill="${c}" opacity=".25"/><rect x="226" y="120" width="290" height="10" rx="5" fill="${c}" opacity=".25"/></g>`,
    artefact:`<g fill="${c}"><rect x="200" y="24" width="200" height="160" rx="10" opacity=".16"/><rect x="222" y="48" width="120" height="14" rx="7" opacity=".7"/><rect x="222" y="74" width="156" height="8" rx="4" opacity=".3"/><rect x="222" y="90" width="140" height="8" rx="4" opacity=".3"/><rect x="222" y="106" width="150" height="8" rx="4" opacity=".3"/></g>`,
    prompt:`<g fill="${c}"><rect x="60" y="40" width="380" height="60" rx="16" opacity=".2"/><rect x="160" y="116" width="380" height="60" rx="16" opacity=".4"/><rect x="84" y="62" width="200" height="10" rx="5" opacity=".7"/><rect x="184" y="138" width="260" height="10" rx="5" opacity=".9"/></g>`,
    projet:`<g fill="${c}"><rect x="60" y="40" width="160" height="120" rx="12" opacity=".2"/><rect x="230" y="40" width="160" height="120" rx="12" opacity=".3"/><rect x="400" y="40" width="140" height="120" rx="12" opacity=".2"/></g>`
  };
  return `<figure class="apercu" style="margin:0"><svg viewBox="0 0 600 210" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${shapes[o.type]}</svg><figcaption>Aperçu en attente de capture</figcaption></figure>`;
}

function filtres(){

  if(V.tri==="recent") L.sort((a,b)=>b.date.localeCompare(a.date));

Exemple d’usage : ${d.usage.trim()}
${etapes.length?"Comment s’en servir :\n"+etapes.map((e,i)=>`  ${i+1}. ${e}`).join("\n")+"\n":""}${d.lien?`Lien vers le fichier : ${d.lien.trim()}\n`:""}
=== CONTRIBUTEUR ===
Grade et nom : ${d.nom.trim()}
Promotion : ${d.promo||"non précisée"}
Adresse de réponse : ${d.mail.trim()}

[x] Je certifie que l’outil ne contient aucune information sensible ni donnée personnelle.

Pièces jointes : ${d.lien?"une capture d’écran (fichier accessible par le lien ci-dessus)":"le fichier de l’outil + une capture d’écran"}.

=== FICHE CATALOGUE (réservé à l’équipe admin) ===
${JSON.stringify(fiche)}
`;
  return {sujet,corps};
}
function valider(){
  const f=$("#formdep"); let premier=null;
  const req=["mail","nom","titre","type","domaine","resume","usage"];
  f.querySelectorAll(".bad").forEach(x=>x.classList.remove("bad"));
  for(const k of req){
    const ok=String(DEP[k]||"").trim() && (k!=="mail"||/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(DEP.mail.trim()));
    if(!ok){ const el=f.querySelector(`[data-f="${k}"]`); el.classList.add("bad"); if(k==="mail"&&DEP.mail) el.querySelector(".msg").textContent="Adresse mail invalide."; premier=premier||el; }
  }
  if(!DEP.certif){ const el=f.querySelector('[data-f="certif"]'); el.classList.add("bad"); premier=premier||el; }
  if(premier){ premier.scrollIntoView({behavior:"smooth",block:"center"}); const c=premier.querySelector("input,textarea,select"); if(c) setTimeout(()=>c.focus({preventScroll:true}),300); toast("Il manque quelques informations : elles sont signalées en rouge."); return false; }
  return true;
}
function afficherPret(){
  const {sujet,corps}=MAILPRET;
  const href=`mailto:${CONFIG.mail}?subject=${encodeURIComponent(sujet)}&body=${encodeURIComponent(corps.replace(/\n/g,"\r\n"))}`;
  $("#pret").innerHTML=`<section class="card pret"><h3><span class="etape-num" style="background:var(--vert)">2</span>VOTRE MAIL EST PRÊT</h3>
    <div class="pj"><b>📎 Avant d’envoyer, joignez :</b><span>${DEP.lien?"une capture d’écran de l’outil":"le fichier de l’outil (.zip, .html, .txt…) et une capture d’écran"}.</span></div>
    <div class="tbl"><table><tr><th>À</th><td>${esc(CONFIG.mail)}</td></tr><tr><th>Objet</th><td>${esc(sujet)}</td></tr></table></div>
    <pre class="modele">${esc(corps)}</pre>
    <div class="row">
      <a class="btn vert" href="${href}" data-ouvrir="1">${svg("mail")}Ouvrir ma messagerie</a>
      <button class="btn" data-copiermail="1">${svg("copy")}Copier le mail</button>
    </div>
    <p class="note">Rien n’est envoyé tant que vous n’avez pas cliqué sur Envoyer dans votre messagerie. Si votre messagerie ne s’ouvre pas, ou si le texte arrive incomplet, utilisez « Copier le mail » et collez-le dans un nouveau message.</p>
  </section>`;
  $("#pret").scrollIntoView({behavior:"smooth",block:"start"});
}
document.addEventListener("input",e=>{
  if(!e.target.closest("#formdep")) return;
  lireForm(); saveDep();
  const fl=e.target.closest(".field"); if(fl) fl.classList.remove("bad");
  const cert=e.target.closest(".certif"); if(cert) cert.classList.remove("bad");
  const c=document.querySelector(`[data-c="${e.target.name}"]`); if(c) c.textContent=`${e.target.value.length} / ${e.target.maxLength}`;
  if(MAILPRET){ MAILPRET=null; $("#pret").innerHTML=""; }
});
document.addEventListener("change",e=>{ if(e.target.closest("#formdep")){ lireForm(); saveDep(); e.target.closest(".field,.certif")?.classList.remove("bad"); if(MAILPRET){ MAILPRET=null; $("#pret").innerHTML=""; } } });
function vCercle(){
  return `<h2>Le Cercle IA</h2>
  <p class="lead">Le Cercle IA de l’École de Guerre – Terre rassemble les outils IA utiles à la promotion, les vérifie et les met à disposition de tous.</p>
  <section class="card"><h3>L’ÉQUIPE ADMIN</h3><div class="tbl"><table>
    <tr><th>Propriétaires (2)</th><td>Gardent la main sur le dépôt et assurent la passation à la promotion suivante.</td></tr>
    <tr><th>Publicateurs (2 à 3)</th><td>Mettent les outils en ligne et tiennent le catalogue à jour.</td></tr>
    <tr><th>Vérificateurs (2 à 3)</th><td>Relisent et testent chaque outil avant publication.</td></tr>
  </table></div><p class="note">Règle des quatre yeux : celui qui vérifie n’est jamais celui qui publie.</p></section>
  <section class="card"><h3>CE QUI EST GARANTI</h3><ul class="l">
    <li>Personne d’extérieur ne peut modifier un outil publié.</li>
    <li>Chaque outil a été relu et testé par au moins un membre du Cercle.</li>
    <li>Le téléchargement ne demande aucun compte.</li></ul></section>
  <section class="card"><h3>CE QUI RESTE À VOTRE CHARGE</h3><ul class="l">
    <li>Relire ce que l’IA produit avant de l’utiliser.</li>
    <li>Ne jamais saisir d’information sensible dans une IA en ligne.</li></ul></section>
  <p class="note">Contact : <a href="mailto:${CONFIG.mail}">${esc(CONFIG.mail)}</a></p>`;
}

/* ---------- rendu & navigation (schéma Garigliano) ---------- */
const TABS=[["cat","Catalogue","cat"],["fav","Favoris","fav"],["guides","Guides","guide"],["dep","Déposer","dep"],["cercle","Le Cercle","cercle"]];
function render(){
  let html, cur=V.r;
  const o=V.r==="tool"&&OUTILS.find(x=>x.id===V.id);
  if(o){ html=vTool(o); cur="cat"; }
  else if(V.r==="cat") html=vCat();
  else if(V.r==="fav") html=vFav();
  else if(V.r==="guides") html=vGuides();
  else if(V.r==="dep") html=vDep();
  else if(V.r==="cercle") html=vCercle();
  else { V.r="home"; html=vHome(); }
  if(V.r!=="home"){
    const hk=cur; const open=V.help[hk];
    html=`<div class="row topbar"><button class="menu-back" data-r="home">☰ Retour au menu</button>${HELP[hk]?`<button class="help-btn" data-help="${hk}" aria-expanded="${!!open}" aria-label="Mode d’emploi">?</button>`:""}</div>${open?`<div class="helpbox">${HELP[hk]}</div>`:""}`+html;
  }
  $("#app").innerHTML=`<div class="view stack">${html}</div>`;
  document.body.classList.toggle("is-home",V.r==="home");
  $("#tabbar").innerHTML=TABS.map(([k,l,ic])=>`<button class="nb" data-r="${k}" ${k===cur?'aria-current="page"':""}><svg viewBox="0 0 24 24" aria-hidden="true">${IC[ic]}</svg>${l}</button>`).join("");
  if(V.r==="cat"){ renderListe(); const q=$("#q"); q.addEventListener("input",()=>{V.q=q.value;renderListe();}); $("#dom").addEventListener("change",e=>{V.dom=e.target.value;renderListe();}); $("#tri").addEventListener("change",e=>{V.tri=e.target.value;renderListe();}); }
  const h=V.r==="tool"?V.id:(V.r==="home"?"":V.r);
  try{ history.replaceState(null,"",h?"#"+h:location.pathname+location.search); }catch(e){}
}
function go(r,id){ V.r=r; V.id=id??null; render(); window.scrollTo(0,0); }
function toast(t){ let el=$("#toast"); if(el) el.remove(); el=document.createElement("div"); el.id="toast"; el.setAttribute("role","status"); el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),3800); }

document.addEventListener("click",ev=>{
  const b=ev.target.closest("button"); if(!b) return; const d=b.dataset;
  if(d.tool) return go("tool",d.tool);
  if(d.settype){ V.type=d.settype; V.groupe=d.settype==="artefact"; V.q=""; V.dom="tous"; return go("cat"); }
  if(d.r){ if(d.r==="cat"&&!b.closest(".view")){V.type="tous";V.groupe=false;} if(d.r==="cat"&&(b.classList.contains("tile")||b.classList.contains("gros"))){V.type="tous";V.groupe=false;} return go(d.r); }
  if(d.type){ V.type=d.type; V.groupe=false; document.querySelectorAll(".chip[data-type]").forEach(c=>c.setAttribute("aria-pressed",c.dataset.type===V.type)); return renderListe(); }
  if(d.reset){ V.q="";V.type="tous";V.dom="tous";V.groupe=false; return render(); }
  if(d.help){ V.help[d.help]=!V.help[d.help]; return render(); }
  if(d.fav){ FAV.has(d.fav)?FAV.delete(d.fav):FAV.add(d.fav); saveFav(); render(); return toast(FAV.has(d.fav)?"Ajouté à vos favoris.":"Retiré de vos favoris."); }
  if(d.dl){ const o=OUTILS.find(x=>x.id===d.dl); const url=CONFIG.dossierOutils+o.id+"/"+o.fichier;
    if(CONFIG.prototype) return toast(`Prototype : sur GitHub, ce bouton servira ${url}`);
    const a=document.createElement("a"); a.href=url; a.download=o.fichier; document.body.appendChild(a); a.click(); a.remove(); return; }
  if(d.demo){ const o=OUTILS.find(x=>x.id===d.demo); const url=/^https?:/.test(o.demo)?o.demo:CONFIG.dossierOutils+o.id+"/"+o.demo;
    if(CONFIG.prototype&&!/^https?:/.test(o.demo)) return toast(`Prototype : sur GitHub, ce bouton ouvrira ${url}`);
    window.open(url,"_blank","noopener"); return; }
  if(d.avis){ const o=OUTILS.find(x=>x.id===d.avis); if(CONFIG.prototype) return toast("Prototype : ce bouton ouvrira le formulaire d’avis, nom de l’outil déjà rempli."); window.open(lienAvis(o),"_blank","noopener"); return; }
  if(d.prep){ lireForm(); saveDep(); if(!valider()) return; MAILPRET=construireMail(); afficherPret(); return; }
  if(d.copiermail&&MAILPRET){ const t=`À : ${CONFIG.mail}\nObjet : ${MAILPRET.sujet}\n\n${MAILPRET.corps}`; (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Mail copié. Collez-le dans un nouveau message, puis joignez votre fichier.")).catch(()=>toast("Copie impossible : sélectionnez le texte à la main.")); return; }
  if(d.effacer){ if(!confirm("Effacer tout le formulaire ?")) return; DEP={}; saveDep(); MAILPRET=null; return render(); }
});
$("#brand").addEventListener("click",()=>go("home"));

/* thème clair / sombre, mémorisé sur cet appareil */
function applyTheme(t){ if(t) document.documentElement.dataset.theme=t; else delete document.documentElement.dataset.theme; }
try{ applyTheme(localStorage.getItem("bo-theme")); }catch(e){}
$("#theme").addEventListener("click",()=>{
  const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  const t=dark?"light":"dark"; applyTheme(t); try{ localStorage.setItem("bo-theme",t); }catch(e){} render();
});

/* page de garde : une fois par jour */
function showCover(){
  const c=$("#cover"); c.hidden=false;
  c.querySelectorAll("[data-cover]").forEach(b=>b.onclick=()=>{ c.classList.add("out"); setTimeout(()=>{c.hidden=true;c.classList.remove("out");},520);
    try{ localStorage.setItem("bo-cover",new Date().toISOString().slice(0,10)); }catch(e){}
    V.type="tous"; V.groupe=false; go(b.dataset.cover); });
}

/* ---------- démarrage : catalogue.json d’abord, secours intégré sinon ---------- */
(async function boot(){
  $("#logo").src=INSIGNE; $("#cvins").src=INSIGNE;
  if(!CONFIG.prototype){ const p=$(".proto"); if(p) p.remove(); }
  let data=null;
  try{ const r=await fetch("catalogue.json",{cache:"no-store"}); if(r.ok) data=await r.json(); }catch(e){}
  if(!data||!Array.isArray(data.outils)) data=JSON.parse($("#catalogue-secours").textContent);
  OUTILS=data.outils.filter(o=>TYPES[o.type]);
  const h=location.hash.slice(1);
  if(h&&OUTILS.some(o=>o.id===h)){ V.r="tool"; V.id=h; }
  else if(["cat","fav","guides","dep","cercle"].includes(h)) V.r=h;
  let day=""; try{ day=localStorage.getItem("bo-cover")||""; }catch(e){}
  if(!h && day!==new Date().toISOString().slice(0,10)) showCover();
  render();
})();
</script>
